# Проверка на настоящей Windows: приложение целиком (оболочка, пути, большой лог, приёмник плагина, .exe)
# и все UI-тесты в Chromium под Windows.
name: Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  app:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Сборка
        shell: bash
        run: |
          python src/build.py
          cp index.html app/index.html
          cd app
          npm install --no-audit --no-fund > ../npm.log 2>&1 || { tail -8 ../npm.log | sed 's/^/::error::/'; exit 1; }
          npm run dist > ../dist.log 2>&1 || { tail -8 ../dist.log | sed 's/^/::error::/'; exit 1; }
      - name: Playwright
        shell: bash
        run: npm install --no-save --no-audit --no-fund playwright@1.49.0
      - name: Проверка приложения
        shell: bash
        run: |
          code=0
          node tests/win/e2e.js 2>&1 | tee win.log || code=$?
          grep -E "FAIL" win.log | head -9 | sed 's/^/::error::/' || true
          grep -E "INFO|WIN" win.log | sed 's/^/::notice::/' || true
          tail -6 win.log | sed 's/^/::warning::/' || true
          exit $code
      - name: Установщик плагинов без Node.js и Git в системе
        shell: bash
        run: |
          code=0
          echo "" | MPI_FORCE_PORTABLE=1 MPI_DATA="$RUNNER_TEMP/mpi data" node plugins/installer/installer.js --setup-tools 2>&1 | tee tools.log || code=$?
          grep -E "TOOLS|Не удалось|✓" tools.log | sed 's/^/::notice::/' || true
          grep -q "TOOLS OK v22" tools.log || code=1
          ls "$RUNNER_TEMP/mpi data/tools" | sed 's/^/::notice::tools: /'
          exit $code
      - name: Сборка Vencord с плагином на переносных Node.js и Git
        shell: bash
        run: |
          code=0
          printf '1\n\n\n\n0\n' | MPI_FORCE_PORTABLE=1 MPI_NO_INJECT=1 MPI_LOCAL=. MPI_HOME="$RUNNER_TEMP/home" MPI_DATA="$RUNNER_TEMP/mpi data" node plugins/installer/installer.js > vc.log 2>&1 || code=$?
          grep -E "BUILD OK|Сборка не удалась|Не удалось|✓" vc.log | sed 's/^/::notice::/' || true
          grep -q "BUILD OK" vc.log || { tail -12 vc.log | sed 's/^/::error::/'; code=1; }
          grep -lq "MajesticLogImport" "$RUNNER_TEMP/home/Vencord/dist/"*.js || { echo "::error::плагина нет в сборке Vencord"; code=1; }
          exit $code
      - name: Снимки окна
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-screens
          path: win-shots/
          if-no-files-found: ignore
  ui:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright и Chromium
        shell: bash
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.0
          npx playwright install chromium
      - name: Тесты ядра
        shell: bash
        run: |
          code=0; node tests/run.js > core.log 2>&1 || code=$?
          grep -E "FAIL|Error" core.log | head -9 | sed 's/^/::error::/' || true
          exit $code
      - name: UI-тесты в Chromium под Windows
        shell: bash
        run: |
          code=0
          node tests/ui/run.js 2>&1 | tee ui.log || code=$?
          grep -E "^FAILED|^UI FAIL" ui.log | head -9 | sed 's/^/::error::/' || true
          tail -6 ui.log | sed 's/^/::warning::/' || true
          exit $code
