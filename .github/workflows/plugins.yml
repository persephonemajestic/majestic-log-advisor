# Собирает Majestic-Plugin-Installer.exe и выкладывает его в выпуск «plugins-installer» (предварительный, чтобы не перебить
# «последний выпуск» приложения). Запускается при изменении установщика или вручную.
name: Установщик плагинов
on:
  push:
    branches: [main]
    paths: ['plugins/installer/**', '.github/workflows/plugins.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Проверка
        shell: bash
        run: node --check plugins/installer/installer.js
      - name: Сборка .exe
        shell: bash
        run: |
          npx --yes @yao-pkg/pkg@6 plugins/installer/installer.js -t node22-win-x64 -o dist/Majestic-Plugin-Installer.exe
          ls -la dist
      - name: Проверка собранного .exe (переносные Node.js и Git)
        shell: bash
        run: |
          code=0
          echo "" | MPI_FORCE_PORTABLE=1 MPI_DATA="$RUNNER_TEMP/exe data" ./dist/Majestic-Plugin-Installer.exe --setup-tools > tools.log 2>&1 || code=$?
          grep -E "TOOLS|Не удалось|✓" tools.log | sed 's/^/::notice::/' || true
          grep -q "TOOLS OK v22" tools.log || { tail -15 tools.log | sed 's/^/::error::/'; code=1; }
          exit $code
      - name: Проверка собранного .exe (сборка Vencord с плагином)
        shell: bash
        run: |
          code=0
          printf '1\n\n\n\n0\n' | MPI_NO_INJECT=1 MPI_LOCAL=. MPI_HOME="$RUNNER_TEMP/exe home" MPI_DATA="$RUNNER_TEMP/exe data" ./dist/Majestic-Plugin-Installer.exe > vc.log 2>&1 || code=$?
          grep -E "BUILD OK|Сборка не удалась|Не удалось|✓" vc.log | sed 's/^/::notice::/' || true
          grep -q "BUILD OK" vc.log || { tail -15 vc.log | sed 's/^/::error::/'; code=1; }
          grep -lq "MajesticLogImport" "$RUNNER_TEMP/exe home/Vencord/dist/"*.js || { echo "::error::плагина нет в сборке Vencord"; code=1; }
          exit $code
      - name: Выпуск
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view plugins-installer >/dev/null 2>&1 || gh release create plugins-installer --prerelease --title "Установщик плагинов Discord" --notes "Majestic Plugin Installer: ставит и обновляет плагины для Vencord и BetterDiscord из plugins/manifest.json. Ваши другие плагины не трогает. Запустите .exe и следуйте подсказкам."
          gh release upload plugins-installer dist/Majestic-Plugin-Installer.exe --clobber
