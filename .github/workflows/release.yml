# Собирает приложение для Windows и публикует его в Releases:
# при пуше тега вида v1.0.0 или сам, когда в main меняется версия в app/package.json (тег v<версия> создаётся автоматически).
name: Windows build
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['app/package.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version
        id: ver
        shell: bash
        run: |
          V=$(node -p "require('./app/package.json').version")
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" != "tag" ] && git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "Релиз v$V уже есть"; fi
      - uses: actions/setup-node@v4
        if: steps.ver.outputs.skip != '1'
        with:
          node-version: 20
      - name: Package
        if: steps.ver.outputs.skip != '1'
        shell: bash
        run: |
          cp index.html app/index.html
          cd app
          npm install --no-audit --no-fund
          npm run dist
          cp README-RU.txt "dist/Majestic Log Advisor-win32-x64/ЧИТАЙ МЕНЯ.txt"
          cd dist
          powershell -NoProfile -Command "Compress-Archive -Path 'Majestic Log Advisor-win32-x64' -DestinationPath 'Majestic-Log-Advisor-win-x64.zip'"
      - name: Installer
        if: steps.ver.outputs.skip != '1'
        shell: bash
        continue-on-error: true
        run: |
          cd app
          npm run installer
      - name: Release
        if: steps.ver.outputs.skip != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            app/installer/Majestic-Log-Advisor-Setup*.exe
            app/dist/Majestic-Log-Advisor-win-x64.zip
          generate_release_notes: true
