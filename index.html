/* Концепция «лабораторный бланк». Светлая бумага холодного оттенка, один кобальтовый акцент, тонкие линии вместо карточек.
   Каркас: тонкая шапка со вкладками, лента файлов, и ниже страница с узкой левой «полосой пометок» (имя лога, метаданные),
   которая прилипает при прокрутке. Диагноз: крупный вердикт слева и отрывной бланк ответа игроку справа.
   Запоминающееся решение: лента попыток запуска на миллиметровке, как самописец. Остальное сдержанно.
   Шкала скруглений: 6px элементы управления, 10px поверхности, полный круг только у статусных пилюль и переключателя. */
:root {
  /* светлая тема в тёплых тонах, как у Claude, чуть темнее; цвета текста с контрастом не ниже 4,5:1 */
  --bg: #E9E6DC; --surface: #F0EDE5; --surface2: #E4E0D5; --raise: #F4F2EC; --paper: #F0EDE5;

  --err: #9A3F12; --err-bg: rgba(154, 63, 18, .08);
  --warn: #735200; --warn-bg: rgba(115, 82, 0, .09);
  --ok: #0B6640; --ok-bg: rgba(11, 102, 64, .08);
  --info: #1A568E; --info-bg: rgba(26, 86, 142, .08);
  --unk: #5340A0; --unk-bg: rgba(83, 64, 160, .08);
  --noise: #5E5C56; --noise-bg: rgba(94, 92, 86, .10);

}

  --unk: #AFA2FF; --unk-bg: rgba(175, 162, 255, .12);
  --noise: #7C8999; --noise-bg: rgba(124, 137, 153, .14);

body[data-state="bad"] { --stc: var(--crit); }

.asks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }

.fi .ej { opacity: 0; border: 0; background: none; color: var(--muted); font-size: 13px; line-height: 1; padding: 0 2px; transition: opacity .15s, color .15s; }
.fi:hover .ej, .fi:focus-within .ej { opacity: 1; }
.fi .ej:hover { color: var(--accent); }
.btn.has-upd { border-color: var(--ok); color: var(--ok); }
#btnBug.bug-hot, #btnBug.bug-hot:hover { background: #C4203F; border-color: #C4203F; color: #fff; font-weight: 600; }

.arc-h b { color: var(--ink); font-size: 12.5px; } .arc-h em { margin-left: auto; font-style: normal; text-decoration: underline; }
.arc-h .sd { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.zone.arc .zone-h .sd, .zone.arc .arc-h .sd { background: var(--muted); }

body .zone.dropok { outline: 2px solid var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.arc-empty { width: auto !important; flex: 1; min-height: 100px; display: grid !important; place-items: center; padding: 10px 14px; border: 1px dashed var(--line2); border-radius: var(--r2); }
.zone[hidden], .flist[hidden] { display: none; }

.fi.back { align-content: center; justify-items: start; color: var(--muted); }

.fi .pinb { opacity: 0; border: 0; background: none; color: var(--muted); padding: 0 2px; line-height: 1; transition: opacity .15s, color .15s; display: inline-flex; }
.fi:hover .pinb, .fi:focus-within .pinb, .fi.pinned .pinb { opacity: 1; }

.dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--noise); }
.dot.d-ok { background: var(--ok); } .dot.d-bad { background: var(--crit); } .dot.d-warn { background: var(--warn); }

.sw input:checked + i { background: var(--accent-soft); border-color: var(--accent-line); }
.sw input:checked + i::after { transform: translateX(12px); background: var(--accent); }
.sw input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }
.ver { color: var(--muted); font-size: 11.5px; font-family: var(--mono); opacity: .85; }

/* ---- страница: полоса пометок слева, содержимое справа ---- */
.main { display: grid; grid-template-columns: 216px minmax(0, 1fr); gap: 0 clamp(24px, 4vw, 64px); padding: 36px clamp(16px, 3vw, 40px) 120px; max-width: 1480px; margin: 0 auto; }
.cmd { position: sticky; top: 88px; align-self: start; padding-top: 4px; }
.ct { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-width: 0; padding-top: 14px; border-top: 2px solid var(--stc); transition: border-color .3s; }
.ct b { font-weight: 600; font-size: 14px; line-height: 1.35; overflow-wrap: anywhere; }
.ct .mut { color: var(--muted); font-size: 12.5px; line-height: 1.5; }
#view { display: grid; gap: 22px; min-width: 0; align-content: start; }

/* ---- элементы управления ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 34px; padding: 0 14px; border-radius: var(--r1); border: 1px solid var(--line2); background: var(--raise); font-weight: 500; white-space: nowrap; transition: background-color .15s, border-color .15s, transform .1s, box-shadow .15s; }
.btn:hover { border-color: var(--ink); }
.btn:active { transform: translateY(1px) scale(.99); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { box-shadow: 0 0 0 3px var(--accent-soft); border-color: var(--accent); }
.btn.sm { min-height: 30px; padding: 0 11px; font-size: 12.5px; }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--ink2); }
.btn.ghost:hover { background: var(--raise); border-color: var(--line2); }
.btn.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
.btn.wide { width: 100%; }
input[type=text], input[type=search], select.sel, textarea.note, .panel textarea { width: 100%; background: var(--raise); border: 1px solid var(--line2); border-radius: var(--r1); padding: 8px 11px; min-width: 0; transition: border-color .15s, box-shadow .15s; }
select.sel { width: auto; appearance: none; -webkit-appearance: none; padding-right: 30px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 16px) 55%, calc(100% - 11px) 55%; background-size: 5px 5px; background-repeat: no-repeat; cursor: pointer; }
input[type=text]:hover, input[type=search]:hover, textarea.note:hover { border-color: var(--ink2); }
input[type=text]:focus, input[type=search]:focus, textarea.note:focus, select.sel:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
::placeholder { color: var(--muted); opacity: .85; }
textarea.note { min-height: 64px; resize: vertical; }
label.nl, .nl.inl { display: grid; gap: 6px; color: var(--muted); font-size: 12.5px; }
.chron li.bad { color: var(--err); }
.hint { color: var(--muted); font-size: 12.5px; margin: 0; line-height: 1.5; }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { font-size: 12px; border: 1px solid var(--line2); background: var(--raise); border-radius: var(--r1); padding: 2px 9px; }
button.chip { font-family: var(--mono); font-size: 11.5px; transition: border-color .15s, color .15s, background-color .15s; }
button.chip:hover { border-color: var(--accent-line); color: var(--accent); background: var(--accent-soft); }
.box.pal { width: min(560px, 94vw); display: flex; flex-direction: column; gap: 8px; }
.box.pal input { width: 100%; font-size: 15px; padding: 9px 11px; }
#palList { max-height: 50vh; overflow: auto; display: flex; flex-direction: column; }
.pal-i { display: flex; gap: 10px; padding: 7px 10px; cursor: pointer; border-radius: 4px; }
.pal-i.on, .pal-i:hover { background: var(--accent-soft); }
.pal-g { flex: 0 0 86px; color: var(--muted, #888); font-size: 12px; align-self: center; }
.pal-t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#toast { position: fixed; right: 16px; bottom: 16px; max-width: min(420px, calc(100vw - 32px)); padding: 10px 14px; border-radius: var(--r2); background: var(--ink); color: var(--bg, #fff); font-size: 13px; box-shadow: 0 6px 24px rgba(0,0,0,.25); opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .2s, transform .2s; z-index: 60; }
#toast.on { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
.chip.tpl { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.kind { font-family: var(--mono); font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--surface2); border: 1px solid var(--line); color: var(--muted); }
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 2px 10px 2px 8px; border-radius: 99px; white-space: nowrap; }
.st::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st-ok { background: var(--ok-bg); color: var(--ok); } .st-bad { background: var(--crit-bg); color: var(--crit); }
.st-warn { background: var(--warn-bg); color: var(--warn); } .st-unk { background: var(--noise-bg); color: var(--noise); }
.st-mod { background: var(--crit); color: var(--bg); font-weight: 600; } .st-mod::before { display: none; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 550; padding: 2px 10px 2px 8px; border-radius: 99px; white-space: nowrap; }
.pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.sev-crit { background: var(--crit-bg); color: var(--crit); } .pill.sev-err { background: var(--err-bg); color: var(--err); }
.pill.sev-warn { background: var(--warn-bg); color: var(--warn); } .pill.sev-info { background: var(--info-bg); color: var(--info); }
.pill.sev-ok { background: var(--ok-bg); color: var(--ok); } .pill.sev-noise { background: var(--noise-bg); color: var(--noise); } .pill.sev-unk { background: var(--unk-bg); color: var(--unk); }
.src { font-size: 12px; color: var(--muted); white-space: nowrap; }
.src.infer, .src.user { color: var(--warn); }
.src.web { color: var(--ink2, var(--warn)); }
.cls { font-size: 12px; border-radius: 4px; padding: 2px 8px; }
.cls-noise, .cls-maybe-noise { background: var(--noise-bg); color: var(--noise); }
.cls-suspect, .cls-problem { background: var(--crit-bg); color: var(--crit); }
.cls-maybe-suspect, .cls-mixed { background: var(--warn-bg); color: var(--warn); }
.cls-new { background: var(--unk-bg); color: var(--unk); }

/* ---- поверхности: тонкая линия, без теней ---- */
html.dense .card { padding: 14px 16px; }
html.dense .fi { padding: 6px 9px; gap: 2px; }
html.dense .lines p { margin: 4px 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r2); padding: 26px 30px; min-width: 0; }
.card.plain { padding: 10px 16px; }
.card.empty { color: var(--muted); text-align: center; padding: 56px 24px; background: transparent; border-style: dashed; border-color: var(--line2); }
details.plain > summary { cursor: pointer; font-weight: 500; }
.list { border-top: 1px solid var(--ink); }
.sec { display: flex; align-items: baseline; gap: 10px; margin: 0 0 14px; font-size: 17px; font-weight: 650; letter-spacing: -.02em; }
.sec .n { font-family: var(--mono); font-size: 12px; font-weight: 400; color: var(--muted); }
.sec + .hint { margin: -6px 0 16px; max-width: 70ch; }
.block { display: grid; }

/* ---- диагноз ---- */
.hero { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(300px, 1fr); gap: 24px; align-items: start; }
.verdict { display: grid; gap: 14px; padding: 0; background: none; border: 0; border-radius: 0; }
.verdict::before { content: none; }
.vmeta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; color: var(--muted); font-size: 12.5px; }
.vmeta .nm { color: var(--ink); font-weight: 550; overflow-wrap: anywhere; }
.verdict h2 { margin: 0; font-weight: 650; font-size: clamp(21px, 2.1vw, 28px); line-height: 1.15; letter-spacing: -.035em; text-wrap: balance; }
.verdict.v-ok h2 { color: var(--ok); } .verdict.v-bad h2 { color: var(--crit); } .verdict.v-warn h2 { color: var(--warn); }
.verdict .lines { display: grid; gap: 10px; max-width: 62ch; }
.verdict .lines p { margin: 0; color: var(--ink2); line-height: 1.65; }
.verdict .lines p:first-child { color: var(--ink); font-size: 15px; }
.pulse-box { display: grid; gap: 10px; padding: 14px 16px 12px; border: 1px solid var(--line2); border-radius: var(--r2); background: linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 100% 12px, linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 12px 100%, var(--surface); }
.pulse { display: flex; align-items: flex-end; gap: 3px; height: 54px; border-bottom: 1px solid var(--ink2); }
.tick { flex: 1 1 0; min-width: 5px; max-width: 16px; height: var(--h, 100%); border: 0; padding: 0; border-radius: 2px 2px 0 0; background: var(--noise); transform-origin: bottom; animation: tick-in .55s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i, 0) * 24ms); transition: filter .15s, transform .15s; }
.tick:hover { filter: brightness(1.2); transform: scaleY(1.08); }
.tick.t-ok { background: var(--ok); } .tick.t-bad { background: var(--crit); } .tick.t-warn { background: var(--warn); }
@keyframes tick-in { from { transform: scaleY(.1); opacity: .2; } to { transform: scaleY(1); opacity: 1; } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.track { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 16px; border: 1px solid var(--line2); border-radius: var(--r2); background: var(--surface); }
.node { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.node::before { content: ''; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line2); }
.node.done { color: var(--ink); } .node.done::before { background: var(--ok); border-color: var(--ok); }
.node.fail { color: var(--ink); } .node.fail::before { background: var(--crit); border-color: var(--crit); }
.link { flex: 1 1 24px; min-width: 20px; max-width: 80px; height: 1px; background: var(--line2); }
.link.done { background: var(--ok); }

/* бланк ответа: отрывной талон с перфорацией */
.answer { position: sticky; top: 84px; display: grid; gap: 10px; padding: 16px 18px 14px; background: var(--raise); border: 1px solid var(--line2); border-radius: var(--r2); }
.answer h3 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
.reply-pv { background: var(--surface2); border: 1px solid var(--line); border-radius: var(--r1); padding: 13px 15px; font-size: 13px; line-height: 1.6; color: var(--ink2); max-height: 280px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; scrollbar-width: thin; }
.answer .more { position: relative; display: grid; gap: 10px; margin: 4px -18px 0; padding: 12px 18px 0; border-top: 1.5px dashed var(--line2); }
.answer .trow { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 8px; }
.answer .mini-d { display: grid; gap: 10px; }
.answer .mini-d > summary.mini { margin-bottom: 4px; }
.answer .more > summary.mini { cursor: pointer; color: var(--muted); font-size: 12.5px; }
.more-l > summary, .nt > summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
.more-l p { margin: 8px 0 0; }
.nt { margin-top: 4px; }
.answer .more::before, .answer .more::after { content: ''; position: absolute; top: -9px; width: 16px; height: 16px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line2); }
.answer .more::before { left: -9px; clip-path: inset(0 0 0 50%); } .answer .more::after { right: -9px; clip-path: inset(0 50% 0 0); }
.answer .more .row-actions .btn { flex: 1 1 auto; }

.prio { display: grid; gap: 8px; padding: 14px 18px; border-radius: var(--r2); border: 1px solid var(--crit-line); border-left: 6px solid var(--crit); background: var(--crit-bg); }
.prio-t { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.prio h2 { margin: 0; font-weight: 650; font-size: clamp(16px, 1.6vw, 19px); line-height: 1.2; letter-spacing: -.025em; text-wrap: balance; color: var(--crit); }
.prio p { margin: 0; max-width: 72ch; color: var(--ink); }
.prio code { background: var(--raise); border: 1px solid var(--crit-line); color: var(--ink); border-radius: var(--r1); padding: 3px 10px; overflow-wrap: anywhere; display: inline-block; }
.prio .files, .found { display: flex; flex-wrap: wrap; gap: 8px; }
.found code { background: var(--raise); border: 1px solid var(--line2); border-radius: var(--r1); padding: 3px 10px; }

/* ведомость находок: строки, а не карточки */
.fd { position: relative; border-bottom: 1px solid var(--line); min-width: 0; }
.fd::before { content: ''; position: absolute; left: 0; top: -1px; bottom: -1px; width: 3px; background: var(--noise); transform: scaleY(0); transform-origin: top; transition: transform .25s cubic-bezier(.2, .8, .2, 1); }
.fd.sev-crit::before { background: var(--crit); } .fd.sev-err::before { background: var(--err); } .fd.sev-warn::before { background: var(--warn); }
.fd.sev-info::before { background: var(--info); } .fd.sev-ok::before { background: var(--ok); } .fd.sev-unk::before { background: var(--unk); }
.fd[open]::before, .fd:hover::before { transform: scaleY(1); }
.fd > summary { list-style: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 18px 16px 18px 20px; cursor: pointer; transition: background-color .15s; }
.fd > summary::-webkit-details-marker { display: none; }
.fd > summary::after { content: ''; flex: none; width: 7px; height: 7px; margin-left: 2px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg) translateY(-2px); transition: transform .2s; }
.fd[open] > summary::after { transform: rotate(-135deg) translate(-2px, -1px); }
.fd > summary:hover { background: var(--surface); }
.fd .ttl { font-weight: 550; font-size: 15px; letter-spacing: -.01em; flex: 1 1 280px; min-width: 0; overflow-wrap: anywhere; }
.fd .cnt { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.fd pre.cmd { margin: 4px 0 6px; padding: 10px 12px; background: var(--raise); border: 1px solid var(--line); border-radius: var(--r1); font: 12px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.fd .was { font-size: 11.5px; color: var(--ok); border: 1px solid var(--ok); border-radius: 9px; padding: 0 7px; white-space: nowrap; }
.fd:has(.was) .pill { opacity: .6; }
.fd .body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px 32px; padding: 6px 16px 16px; background: var(--surface); border-top: 1px solid var(--line); padding-top: 24px; }
.fd .col { display: grid; gap: 20px; align-content: start; min-width: 0; }
.fd .cause { margin: 0; max-width: 62ch; color: var(--ink2); line-height: 1.65; }
.fd h4 { margin: 0 0 8px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 12px; line-height: 1.55; }
.steps li::before { content: counter(s); width: 22px; height: 22px; border-radius: var(--r1); display: grid; place-items: center; font: 500 11px var(--mono); color: var(--accent-ink); background: var(--ink); }
.dets { font-family: var(--mono); font-size: 12px; display: grid; gap: 4px; background: var(--raise); border: 1px solid var(--line); border-radius: var(--r1); padding: 12px 14px; overflow-x: auto; color: var(--ink2); }
.dets div { white-space: pre-wrap; overflow-wrap: anywhere; }
.list > .uk { border: 0; border-radius: 0; background: transparent; border-bottom: 1px solid var(--line); padding: 20px 20px; }

.uk { display: grid; gap: 12px; padding: 20px 24px; border: 1px solid var(--line); border-radius: var(--r2); background: var(--surface); min-width: 0; }
.uk.is-noise { opacity: .72; }
.uk-h { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.uk-s { display: block; background: var(--raise); border: 1px solid var(--line); padding: 10px 12px; border-radius: var(--r1); overflow-x: auto; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink2); }
.ctx { display: grid; gap: 8px; }
.ctx div { display: flex; gap: 6px 16px; flex-wrap: wrap; }
.ctx .k { color: var(--muted); min-width: 140px; }
.tbl-wrap { overflow-x: auto; margin-top: 14px; }
table.at { border-collapse: collapse; width: 100%; font-size: 13px; }
table.at th, table.at td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.at th { color: var(--muted); font-weight: 550; font-size: 12.5px; border-bottom-color: var(--ink); }
table.at tbody tr { transition: background-color .12s; } table.at tbody tr:hover { background: var(--surface2); }
table.at td.wrapc { white-space: normal; min-width: 220px; }
.ai { background: var(--accent-soft); border: 1px solid var(--accent-line); border-radius: var(--r1); padding: 12px 14px; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 92ch; line-height: 1.6; }
.diag dl { margin: 0; display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; }
.diag dt { color: var(--muted); font-size: 12px; padding-top: 2px; }
.diag dd { margin: 0; overflow-wrap: anywhere; }
.diag ol { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.conf.high { color: var(--ok, #1f7a3d); }
.conf.medium { color: var(--warn, #b26a00); }
.conf.low { color: var(--crit, #b3261e); }
.ai.err { background: var(--crit-bg); border-color: var(--crit-line); color: var(--crit); }
.ai-h { font-size: 12px; color: var(--muted); margin-bottom: 6px; }

/* ---- лог ---- */
.logview { display: grid; gap: 14px; }
.logview .chips:empty { display: none; }
.lt { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.lt input[type=search] { flex: 1 1 220px; width: auto; }
.tgl { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; }
.seg { display: inline-flex; gap: 0; border-radius: var(--r1); border: 1px solid var(--line2); background: var(--raise); overflow: hidden; }
.seg button { border: 0; background: none; padding: 5px 13px; color: var(--muted); font-weight: 500; transition: color .15s, background-color .15s; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--ink); color: var(--bg); }
.logsplit { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
.logmain { display: grid; gap: 12px; min-width: 0; }
.sc { height: calc(100vh - 300px); min-height: 380px; resize: vertical; overflow: auto; background: var(--raise); border: 1px solid var(--line2); border-radius: var(--r2); position: relative; font-family: var(--mono); font-size: 12px; scrollbar-width: thin; }
.sp { position: relative; min-width: 100%; }
.rows { position: absolute; left: 0; top: 0; min-width: 100%; }
.ln { display: flex; height: var(--lh, 20px); line-height: var(--lh, 20px); white-space: pre; cursor: pointer; border-left: 2px solid transparent; transition: background-color .1s; }
.ln:hover { background: var(--surface2); }
.ln .no { flex: 0 0 calc(var(--lh, 20px) * 3.2); text-align: right; padding-right: 12px; color: var(--muted); user-select: none; font-variant-numeric: tabular-nums; opacity: .85; }
.ln .tx { flex: 1; min-width: 0; padding-right: 20px; }
.ln.w { height: calc(var(--n, 1) * var(--lh, 20px)); white-space: pre-wrap; word-break: break-all; overflow: hidden; }
.sc.wrap { overflow-x: hidden; }
.ln.s7 { background: var(--crit-bg); border-left-color: var(--crit); } .ln.s6 { background: var(--err-bg); border-left-color: var(--err); }
.ln.s5 { background: var(--warn-bg); border-left-color: var(--warn); } .ln.s4 { background: var(--unk-bg); border-left-color: var(--unk); }
.ln.s3 { border-left-color: var(--info); } .ln.s1 { border-left-color: var(--ok); } .ln.s1 .tx { color: var(--ok); }
.ln.s2 { color: var(--muted); } .ln.sel { box-shadow: inset 0 0 0 1px var(--accent); }
.ln.mk .no::after { content: '★'; color: var(--warn); margin-left: 3px; }
.ln mark { background: var(--ink); color: var(--bg); border-radius: 3px; padding: 0 3px; font-weight: 500; }
/* Подсветка синтаксиса строк лога */
.k-ts { color: var(--muted); } .k-nd { color: var(--info); } .k-key { color: var(--ink); font-weight: 600; }
.k-lv { font-weight: 600; } .k-error { color: var(--err); } .k-warn { color: var(--warn); } .k-info, .k-debug, .k-trace { color: var(--muted); }

<script>

   Работает и в браузере (глобальная LogCleaner), и в Node (require). Без зависимостей.

   LogCleaner.clean(text, opts) -> {
     text,        // очищенный лог
     death,       // последние N записей перед MINIDUMP / Shutting down / падением процесса (массив строк)
     trigger,     // { kind, line, index }: что принято за точку смерти
     stats        // { inBytes, outBytes, inLines, outLines, removed: { правило: строк }, squashed: { семейство: число свёрнутых } }
   }

  var STACKHEAD = /^\[[^\]]*\]\s*Callstack:\s*$/;

  var FAMILIES = [
    { id: 'Cannot destroy NetworkObject', re: /Cannot destroy NetworkObject/ },
    { id: 'Peer limiter blocked the packet', re: /Peer limiter blocked the packet/ },
    { id: 'Packet failed to send', re: /Packet failed to send/ },
    { id: 'tick was too long', re: /Resource \S+ tick was too long \d+ ms/ },
    { id: 'Promise resolved after being resolved', re: /Promise resolved after being resolved/ },

var MAINRE = /^\[(\d{4}-\d\d-\d\d) (\d\d:\d\d:\d\d(?:\.\d+)?)\]\s*(?:\[(\w+)\]\s*)?(?:\[\s*\(([^)]*)\)\s*\]\s*)?(.*)$/;

function msgOf(t) { var x = /message:\s*(?:'([^']*)|"((?:[^"\\]|\\.)*)")/.exec(t); return x ? (x[1] != null ? x[1] : x[2].replace(/\\'/g, "'")).replace(/\\r\\n/g, ' ').trim() : ''; }
function owner(s) { if (MJ.test(s)) return 'mj'; if (GTA.test(s)) return 'gta'; return '?'; }

  { re: /^ERR_SYS_(?:STREAMERREAD|PAR_\d+)/, t: 'повреждены данные игры', cause: 'Игра прочитала повреждённые данные. Источник обычно один: битые файлы GTA V или кеш Majestic.', fix: ['Перезагрузить компьютер и повторить запуск.', 'Проверить целостность файлов GTA V.', 'Нажать «Очистить кеш» в лаунчере и перепроверить файлы Majestic.'] },

  { re: /^ERR_NET_WINSOCK/, t: 'ошибка сети Windows (WinSock)', cause: 'Сетевой стек Windows вернул ошибку. Часто виноваты VPN, сторонний сетевой драйвер или фильтр антивируса.', fix: ['Перезагрузить компьютер, отключить VPN и прокси, повторить запуск.', 'Если повторяется: от администратора выполнить netsh winsock reset и перезагрузиться.', 'Временно отключить сетевые функции антивируса и сторонние фаерволы.'] },

R({ id: 'm-launchfail', kind: 'main', kw: 'game launch failed', re: /game launch failed \{[^}]*?reason:\s*'([^']+)'(?:[^}]*?message:\s*'([^']*)')?/, sev: 'warn', warnAt: 1, src: 'obs', loopAt: 3,
  title: 'Запуск игры не удался (лаунчер не получил манифест)',
  detail: function (m) { return m[1] + (m[2] ? ': ' + m[2].slice(0, 120) : ''); },
  /* общее правило уступает частному: если у причины есть своё правило ниже по списку (права, диск, патчер, таймаут…), берётся оно */
  test: function (m, t, e) { var me = this; for (var i = me.idx + 1; i < RULES.length; i++) { var r = RULES[i]; if (r.kind !== 'main' || r.custom || r.sev === 'noise' || r.sev === 'ok') continue; var kws = r.kws || (Array.isArray(r.kw) ? r.kw : [r.kw]), hit = false; for (var k = 0; k < kws.length; k++) if (kws[k] && t.indexOf(kws[k]) !== -1) { hit = true; break; } if (hit && r.re.test(t)) return false; } return true; },
  refine: function (m) { var rs = m[1], net = /manifest|network|fetch|cdn|dns|socket|connect/i.test(rs + ' ' + (m[2] || '')); return net ? null : { key: rs, title: 'Запуск игры не удался: ' + rs, cause: 'Лаунчер прервал запуск с причиной «' + rs + '»' + (m[2] ? ' (' + m[2].slice(0, 120) + ')' : '') + '. Отдельного правила для этой причины нет: смотрите сообщение и строки рядом, а также находки выше.', fix: ['Перезапустить лаунчер от имени администратора и повторить запуск.', 'Если повторяется: прислать main.log сразу после ошибки и указать время попытки.'] }; },
  cause: 'Лаунчер не смог получить манифест обновления (update.json) с CDN Majestic: обрыв или таймаут сети. Это сеть игрока или провайдера, не повреждение файлов игры.',
  fix: ['Проверить, открывается ли https://cdn.majestic-files.net/ в браузере; отключить VPN и прокси.', 'Сменить DNS на 1.1.1.1 / 8.8.8.8 и повторить запуск.', 'Добавить лаунчер в исключения антивируса и брандмауэра.'] });
